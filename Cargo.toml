[package]
name = "crosshair-reticle"
version = "1.0.0"
edition = "2021"
description = "Crosshair reticle - customizable crosshair overlay for Windows"
license = "MIT"
default-run = "crosshair-reticle"

[lib]
name = "crosshair_reticle"
path = "src/lib.rs"

[[bin]]
name = "crosshair-reticle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.19"
rfd = "0.15"
arboard = { version = "3", default-features = false }
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# panic = "unwind" (default) is required: the overlay thread restarts itself after a panic (NFR-07)
